name: Standalone Web

on:
  push:
    branches: [platform-next]
    paths:
      - 'web/**'
      - '.github/workflows/standalone-web.yml'
  pull_request:
    paths:
      - 'web/**'
      - '.github/workflows/standalone-web.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package.json
      - run: npm install
      - run: npx tsc --noEmit
      - run: npm run build
