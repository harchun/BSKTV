name: BSKTV PHP Lint
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: PHP syntax check
        shell: bash
        run: |
          set -e
          find . -type f -name '*.php' -print0 | while IFS= read -r -d '' file; do php -l "$file"; done
